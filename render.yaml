services:
  # Ingestion & Transformation Pipeline Service
  - type: web
    name: rundir-pipeline
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8086
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_CONCURRENT_STREAMS
        value: 10
      - key: BATCH_INSERT_CHUNK_SIZE
        value: 500
      - key: DATABASE_URL
        fromDatabase:
          name: rundir-postgres
          property: connectionString

databases:
  # Managed PostgreSQL Instance
  - name: rundir-postgres
    region: oregon
    plan: free
    databaseName: rundir_db
    user: rundir_user
